name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: testapp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: testapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testapp -d testapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://testapp:ci-only-password@localhost:5432/testapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
